[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petabtests"
dynamic = ["version"]
description = "PEtab testsuite library"
readme = "README.md"
authors = [
    { name = "Daniel Weindl", email = "sci@danielweindl.de" },
    { name = "Yannik Schaelte", email = "yannik.schaelte@gmail.com" },
]
maintainers = [
    { name = "Daniel Weindl", email = "sci@danielweindl.de" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["PEtab", "testsuite"]
dependencies = [
    "antimony>=2.14.0",
    "numpy>=1.22",
    "pandas>=2.0",
    "petab>=0.4.0",
    "pysb>=1.16.0",
]

[project.urls]
homepage = "https://github.com/PEtab-dev/petab_test_suite"

[project.scripts]
petabtests_create = "petabtests.core:_cli_create"
petabtests_clear = "petabtests.core:clear"

[tool.uv]
# pysb<1.17 fails to build: its legacy `ez_setup.py` bootstrap downloads
# setuptools from a defunct pypi.python.org URL.
constraint-dependencies = ["pysb>=1.17.0"]
# pysb pins an older sympy than petab needs; force a newer one.
override-dependencies = ["sympy>=1.12.1"]

[dependency-groups]
# Not `[tool.uv.sources]`, which uv also applies when `petabtests` is
# installed from git or a path, conflicting with other `petab` sources
# (e.g., an editable libpetab).
dev = ["petab @ git+https://github.com/PEtab-dev/libpetab-python@main"]


[tool.ruff]
line-length = 79
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = [
    "B028",
    "UP",  # pyupgrade
]
ignore = ["E402", "F403", "F405", "E741"]
exclude = ["petabtests/cases/**/*.md", "cases/**"]

[tool.ruff.lint.per-file-ignores]
"petabtests/cases/v2.0.0/pysb/*/_model.py" = ["F821"]
"petabtests/cases/v2.0.0/pysb/*/conversion_modified_pysb.py" = ["F821"]
"petabtests/conversion_*pysb.py" = ["F821"]
"petabtests/C.py" = ["N999"]

